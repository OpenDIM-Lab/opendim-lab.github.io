<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} - {% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/css/main.css' | prepend: site.baseurl | prepend: site.url}}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="icon" type="image/png" href="{{ '/images/logo/lab-logo_1.png' | relative_url }}">
  <script src="https://kit.fontawesome.com/a24320d871.js" crossorigin="anonymous"></script>

{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>
@media (min-width: 1200px) {
  .container {
    width: 95%;
    max-width: 1400px;
  }
}
  /* 全站字体 */
  body,
  button,
  input,
  select,
  textarea {
    font-family: "Inter", "Microsoft YaHei", sans-serif;
  }

  body {
    font-size: 18px;
    font-weight: 400;
    line-height: 1.6;
    color: #4b5563;
  }

  /* 标题 */
  h1, h2, h3, h4, h5, h6 {
    font-family: "Inter", "Microsoft YaHei", sans-serif;
    color: #1f2937;
    font-weight: 500;
    line-height: 1.3;
  }

  /* 左上角实验室名称 */
  .navbar-brand {
    display: flex;
    align-items: center;
    white-space: nowrap;
    font-family: "Inter", sans-serif;
    font-size: 28px;
    font-weight: 500;
    color: #1f2937 !important;
  }

  .navbar-brand-logo {
    display: inline-block;
    width: auto;
    height: 30px;
    margin-left: 1px;
    max-width: none;
    object-fit: contain;
    transform: translateY(-1.5px);
  }

  /* 顶部菜单 */
  .navbar-nav > li > a {
    font-family: "Inter", sans-serif;
    font-size: 16px;
    font-weight: 400;
    text-transform: uppercase;
    color: #1f2937 !important;
  }

  /* 首页正文左对齐，避免单词间距被拉大 */
  #homeid p,
  #homeid li {
    text-align: left;
    line-height: 1.65;
  }

  strong, b {
    font-weight: 600;
  }
</style>
</head>
