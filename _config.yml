title: OpenDIM Lab
email: "y.lin@bit.edu.cn" 
description: >-
  OpenDIM Lab conducts research on tactile sensing, dexterous
  manipulation, and embodied intelligence, developing robots
  that learn to interact with the physical world.
baseurl: ""
url: "https://www.opendimlab.com"

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
